name = "deh-games"
main = "worker.js"
compatibility_date = "2026-08-01"

# آدرسِ عمومیِ ورکرِ اصلی (api-main) — برایِ صدا زدنِ اندپوینتِ داخلیِ پوش‌نوتیفیکیشنِ دعوت.
# همون آدرسیه که تو index.html به‌عنوانِ WORKER_DIRECT_URL استفاده شده.
[vars]
MAIN_API_BASE = "https://api-7x2.pages.dev"

# کلیدِ مشترک برای احرازِ درخواست‌هایِ داخلیِ بینِ دو ورکر — باید دقیقاً همون مقداری باشه که
# تو ورکرِ اصلی env.INTERNAL_KEY هست (همونی که پروکسیِ Pages ازش استفاده می‌کنه). این یه secret ـه،
# نه یه var معمولی، پس تو wrangler.toml نمی‌ذاریمش؛ با این دستور ستش کن:
#   wrangler secret put INTERNAL_KEY

# همون D1ای که سایتِ اصلی استفاده می‌کنه — این یعنی توکن/سشن/پروفایلِ کاربرها مشترکه.
# database_id رو از داشبورد Cloudflare بردار: Workers & Pages > D1 > دیتابیسِ سایتِ اصلی > Settings
[[d1_databases]]
binding = "D1"
database_name = "d1b"
database_id = "8b17cbec-8bc3-4e27-aa12-55f2adf73921"

[[durable_objects.bindings]]
name = "DOOZ_ROOM"
class_name = "DoozRoom"

[[durable_objects.bindings]]
name = "DOOZ_LOBBY"
class_name = "DoozLobby"

# روی پلنِ رایگانِ Cloudflare، Durable Objectها باید از نوعِ SQLite باشن (new_classes معمولی فقط پولیه)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DoozRoom", "DoozLobby"]
