name = "dehaat-games"
main = "worker.js"
compatibility_date = "2026-08-01"

# همون D1ای که سایتِ اصلی استفاده می‌کنه — این یعنی توکن/سشن/پروفایلِ کاربرها مشترکه.
# database_id رو از داشبورد Cloudflare بردار: Workers & Pages > D1 > دیتابیسِ سایتِ اصلی > Settings
[[d1_databases]]
binding = "D1"
database_name = "REPLACE_WITH_YOUR_D1_DATABASE_NAME"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[durable_objects.bindings]]
name = "DOOZ_ROOM"
class_name = "DoozRoom"

[[durable_objects.bindings]]
name = "DOOZ_LOBBY"
class_name = "DoozLobby"

[[migrations]]
tag = "v1"
new_classes = ["DoozRoom", "DoozLobby"]
